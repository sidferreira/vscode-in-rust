[package]
name = "vsr-app"
description = "The rscode desktop binary (native workbench window)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rscode"
path = "src/main.rs"

[dependencies]
vsr-text.workspace = true
# UI: gpui via gpui-kit (ADR-0012). 0.9.1 is quarantined by the proxy; pinned exactly.
gpui-kit = "=0.9.0"
vsr-editor.workspace = true

[dev-dependencies]
# Headless gpui tests (TestAppContext / VisualTestContext), docs/testing.md tier 2.
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
