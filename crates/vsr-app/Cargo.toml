[package]
name = "vsr-app"
description = "The rscode desktop binary (native workbench window)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rscode"
path = "src/main.rs"

[dependencies]
vsr-text.workspace = true
vsr-settings.workspace = true
serde = { version = "1", features = ["derive"] }
vsr-search.workspace = true
vsr-quickinput.workspace = true
vsr-commands.workspace = true
vsr-theme.workspace = true
ignore = "0.4"
vsr-find.workspace = true
futures = "0.3"
# Recursive file watching (ADR-0039); notify 8.2.1 is the version the package proxy allows.
notify = "8.2.1"
# Move deleted files to the macOS Trash (ADR-0039). Behind the `Trash` trait.
trash = "5"
# Natural (numeric-aware, case-insensitive) name order for explorer.sortOrder, as upstream's
# `Intl.Collator(numeric: true)` in compareFileNames (ADR-0041).
natord = "1"
regex = "1"
serde_json = "1"
# Session storage (ADR-0040): atomic file replacement and stable content hashes, not hand-rolled.
tempfile = "3"
sha2 = "0.10"
# UI: gpui via gpui-kit (ADR-0012). 0.9.1 is quarantined by the proxy; pinned exactly.
gpui-kit = "=0.9.0"
vsr-editor.workspace = true
vsr-syntax.workspace = true
vsr-languages.workspace = true
vsr-textmate.workspace = true
# Pixel buffer for the minimap image (gpui `RenderImage` frames); already in the lockfile via gpui.
image = { version = "0.25", default-features = false }

# The macOS find pasteboard (`editor.find.globalFindClipboard`, ADR-0027). Both crates are already in the
# lockfile through gpui; only the NSPasteboard and NSString features are turned on here.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString"] }

[dev-dependencies]
# Headless gpui tests (TestAppContext / VisualTestContext), docs/testing.md tier 2 (ADR-0017/0018).
# gpui-kit's own `test-support` feature cannot be used: it makes the lockfile resolver pull the
# gpui-fast stack, whose pins conflict with gpui-pre's (taffy, unicode-properties).
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
# Real macOS (CoreText) text system for font regression tests (the test platform's is a no-op).
gpui-apple = { package = "gpui-pre-apple", version = "=0.3.11" }
