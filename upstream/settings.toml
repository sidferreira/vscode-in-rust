# Settings port policy: read by scripts/settings-port (see docs/settings-migration.md).
#
# This file is the only place where we decide what a setting means for rscode. Every n/a,
# priority and grouping choice below is a POLICY decision the user should review. Keep the
# subset of TOML simple: tables, [[arrays of tables]], strings, string arrays, ints, bools.
#
# Status precedence per setting: wired (crates/vsr-app/src/config/wired.rs) > first matching
# [[rule]] > deprecated policy > exthost (contributed by a built-in extension) > todo.
# A [[rule]] sets its status to one of: n/a, blocked, exthost, todo (the script rejects others).
# Use n/a and blocked for the two cases below; exthost and todo exist only to override a rule.
#   n/a      never applies to rscode (Windows/Linux-only, telemetry, web-only, deprecated, AI chat
#            policy). A decision, not a backlog item. Never used for deferred work.
#   blocked  deferred: applies to rscode later, but needs a feature that does not exist yet. Not
#            actionable (`next` skips it) and counted separately, so the backlog stays honest.
#            The reason says what it needs ("needs editor splits and editor groups").
# Patterns are upstream-style globs: `*` is a wildcard, case-insensitive, whole key.
# Rule `match` is against the setting key; `source` (optional) against the export's source.
# Unblocking: when the feature lands, delete the blocked rule (the settings become todo), or
# change its status to "todo" to keep the settings as work without a rule.

[upstream]
# The clone is read from its working tree at the pinned commit (UPSTREAM.md).
clone = "../vscode-original"
pinned = "50e1350fc78df67b11049b903d96b530f28d26a5"

[policy]
# Settings marked `deprecated` upstream (165 keys) are n/a. Change to "todo" to implement them.
deprecated = "n/a"

[priority]
# P1: visible in everyday editing (editor basics, files, explorer, search, layout, window chrome).
# Commonly Used settings are P1 regardless of this list.
p1 = [
  "editor.font", "editor.cursor", "editor.tab", "editor.word", "editor.format", "editor.find",
  "editor.render", "editor.minimap", "editor.suggest", "editor.hover", "editor.folding",
  "editor.scroll", "editor.stickyScroll", "editor.gotoLocation", "editor.guides",
  "editor.selection", "files", "files.*", "explorer", "explorer.*", "search", "search.*",
  "workbench.activityBar", "workbench.sash", "workbench.editor", "workbench.commandPalette",
  "window", "breadcrumbs.show", "outline.show",
]# P3: niche, preview/experimental or language-specific tooling nobody needs first.
p3 = [
  "*.experimental", "*experimental*", "mergeEditor", "multiDiffEditor", "imageCarousel",
  "mediaPreview", "timeline", "references", "grunt", "gulp", "jake", "php*", "ipynb",
  "simpleBrowser", "notebook*", "interactiveWindow", "emmet*", "npm*", "merge-conflict",
  "screencastMode", "comments", "testing*", "markdown-mermaid", "markdown-math", "jsts-chat-features",
  "diffEditor*", "multiDiffEditor*",
]

# Group overrides: first match wins. Default grouping is `a.b` or `a.<word>` (see
# assign_groups in the script). Example: [[group]] match = ["editor.wordWrap*"] id = "editor.wrap"
# Keep the list empty until a group is clearly wrong.

# ---------------------------------------------------------------------------------------------
# n/a rules. Each reason is listed so the user can review it. Explicit key lists are preferred
# over broad globs wherever a glob would catch a setting we do want.
# ---------------------------------------------------------------------------------------------

[[rule]]
status = "n/a"
reason = "windows-only setting"
comment = "Keys with a .windows suffix (profiles, env) or a Windows-only name. macOS and Linux do not read them."
match = ["*.windows", "terminal.integrated.windowsUseConptyDll", "terminal.integrated.windowsReparentConsoleWindow",
         "terminal.integrated.enableWin32InputMode", "terminal.integrated.suggest.windowsExecutableExtensions",
         "git.ignoreWindowsGit27Warning", "terminal.external.windowsExec"]

[[rule]]
status = "n/a"
reason = "no effect on macOS (upstream description)"
comment = "Menubar mnemonics (Alt+F). The upstream description says it does nothing on macOS."
match = ["terminal.integrated.allowMnemonics"]

[[rule]]
status = "n/a"
reason = "linux-only setting"
comment = "Keys with a .linux suffix, plus the Linux external-terminal exec."
match = ["*.linux", "terminal.external.linuxExec"]

[[rule]]
status = "n/a"
reason = "web-only"
comment = "Web worker extension host and the web variant of the TypeScript server; rscode is desktop-only (ADR-0019)."
match = ["extensions.webWorker", "*tsserver.web.*"]

[[rule]]
status = "n/a"
reason = "telemetry (rscode ships none)"
comment = "No telemetry pipeline is planned; the settings would configure nothing."
match = ["telemetry.*"]

[[rule]]
status = "blocked"
reason = "needs multi-line selection matches"
comment = "editor.selectionHighlightMultiline. The default (false) matches upstream: a multi-line selection is not highlighted. Setting it to true has no effect yet; the highlight search is per line (ADR-0032)."
match = ["editor.selectionHighlightMultiline"]

[[rule]]
status = "n/a"
reason = "auto-update (product)"
comment = "rscode has no updater; update channels are a product service."
match = ["update.*"]

[[rule]]
status = "n/a"
reason = "remote development / tunnels (out of scope)"
comment = "Remote and tunnel features are not planned; ADR-0019 scopes rscode to local desktop."
match = ["remote.*", "debug.javascript.automaticallyTunnelRemoteServer"]

[[rule]]
status = "n/a"
reason = "settings sync (product service)"
comment = "Cloud settings sync is a Microsoft account service."
match = ["settingsSync.*"]

[[rule]]
status = "n/a"
reason = "AI chat, agents and copilot (product)"
comment = "rscode does not ship Copilot or chat. Accessibility signals named chat* stay todo (they are under accessibility.*)."
match = ["chat.*", "inlineChat.*", "mcp.*", "agents.*", "sessions.*", "dictation.*", "github.*",
         "github-enterprise.*", "onboarding.*", "accessibility.verbosity.browserElementCommenting"]

[[rule]]
status = "n/a"
reason = "accounts, sign-in, cloud and issue reporter (product)"
comment = "Account and sign-in UI belongs to the product services; the issue reporter is hidden on desktop."
match = ["workbench.accounts.*", "workbench.cloudChanges.*", "workbench.experimental.cloudChanges.*", "issueReporter.*"]

[[rule]]
status = "n/a"
reason = "integrated browser (product feature; revisit)"
comment = "workbench.browser.* configures the built-in browser pane, a product feature. Revisit if rscode gets one."
match = ["workbench.browser.*"]

[[rule]]
status = "n/a"
reason = "sign-in and Microsoft/GitHub account extensions (product)"
comment = "Extension-contributed settings from the GitHub and Microsoft authentication and sign-in extensions."
source = ["vscode.github", "vscode.github-authentication", "vscode.github-enterprise*", "vscode.microsoft-authentication",
          "vscode.microsoft-sovereign-cloud", "TypeScriptTeam.jsts-chat-features"]

# ---------------------------------------------------------------------------------------------
# workbench.editor (Editor management, ADR-0033). The settings below are status `blocked`: they
# need a feature rscode does not have yet, so they are deferred, not declined. Each reason says
# what it needs ("needs ..."). When that feature lands, delete the rule (or set it to "todo") so
# the settings enter the backlog. The wired ones are in config/wired.rs and need no rule.
# ---------------------------------------------------------------------------------------------

[[rule]]
status = "n/a"
reason = "AI chat, agents and copilot (product)"
comment = "The Agents window's Markdown editor default. rscode has no Agents window."
match = ["workbench.editor.markdownDefaultEditorInAgentsWindow"]

[[rule]]
status = "blocked"
reason = "needs editor splits and editor groups (one group in rscode)"
comment = "Multi-group behaviour: a single editor group exists, so these have no observable effect yet. closeEmptyGroups and autoLockGroups apply to groups; revealIfOpen only matters across groups; openSideBySideDirection needs splits; doubleClickTabToToggleEditorGroupSizes resizes groups."
match = ["workbench.editor.closeEmptyGroups", "workbench.editor.autoLockGroups", "workbench.editor.revealIfOpen",
         "workbench.editor.openSideBySideDirection", "workbench.editor.doubleClickTabToToggleEditorGroupSizes",
         "workbench.editor.sharedViewState", "workbench.editor.limit.perEditorGroup"]

[[rule]]
status = "blocked"
reason = "needs navigation history (Go Back / Go Forward)"
comment = "Needs a navigation history of editor positions. Mouse buttons 4 and 5, three-finger swipe and the scope of history navigation all depend on it."
match = ["workbench.editor.mouseBackForwardToNavigate", "workbench.editor.swipeToNavigate", "workbench.editor.navigationScope"]

[[rule]]
status = "blocked"
reason = "needs untitled, binary, custom and large-file editors"
comment = "rscode has no untitled files, binary editor, custom editor associations or large-file confirmation dialog yet."
match = ["workbench.editor.untitled.labelFormat", "workbench.editor.defaultBinaryEditor", "workbench.editorAssociations",
         "workbench.editorLargeFileConfirmation", "workbench.editor.hiddenEditorTypes", "workbench.editor.useModal"]

[[rule]]
status = "blocked"
reason = "needs language detection for untitled and unknown files"
comment = "No language detection service. Needs the untitled editors above."
match = ["workbench.editor.languageDetection", "workbench.editor.historyBasedLanguageDetection",
         "workbench.editor.preferHistoryBasedLanguageDetection", "workbench.editor.languageDetectionHints"]

[[rule]]
status = "blocked"
reason = "needs tab strip presentation (scrollbars, wrapping, pinned tabs, actions)"
comment = "The tab strip is one scrollless row with close buttons only. Pinned tabs can be made (double click) but not sized or placed differently yet; the title scrollbar and editor title actions do not exist."
match = ["workbench.editor.titleScrollbarSizing", "workbench.editor.titleScrollbarVisibility", "workbench.editor.wrapTabs",
         "workbench.editor.pinnedTabSizing", "workbench.editor.pinnedTabsOnSeparateRow", "workbench.editor.preventPinnedEditorClose",
         "workbench.editor.editorActionsLocation", "workbench.editor.alwaysShowEditorActions",
         "workbench.editor.centeredLayoutAutoResize", "workbench.editor.centeredLayoutFixedWidth"]

[[rule]]
status = "blocked"
reason = "needs file decorations and custom tab labels"
comment = "Decorations need the SCM and problems services (git status and diagnostics colours and badges). customLabels.patterns needs a label service."
match = ["workbench.editor.decorations.badges", "workbench.editor.decorations.colors", "workbench.editor.customLabels.enabled",
         "workbench.editor.customLabels.patterns"]

[[rule]]
status = "blocked"
reason = "needs multi-window support (dragging out opens a window)"
comment = "Dragging an editor out of the window opens a new window; rscode is one window."
match = ["workbench.editor.dragToOpenWindow"]

# ---------------------------------------------------------------------------------------------
# window and workbench (window chrome and general workbench, ADR-0035). Wired ones are in
# config/wired.rs and take precedence. The rest are blocked on a feature rscode does not have.
# ---------------------------------------------------------------------------------------------

[[rule]]
status = "n/a"
reason = "fetches Microsoft online experiments (product service)"
comment = "workbench.enableExperiments asks Microsoft's experiment service which experiments to run. rscode has no such service and will not use it."
match = ["workbench.enableExperiments"]

[[rule]]
status = "n/a"
reason = "application icon in the custom title bar is shown on Windows and Linux only"
comment = "window.doubleClickIconToClose acts on the app icon. Upstream creates that icon only when isWindows || isLinux (titlebarPart.ts), so it never applies on macOS."
match = ["window.doubleClickIconToClose"]

[[rule]]
status = "blocked"
reason = "needs multi-window support (native window tabs, several windows, zoom and size per window)"
comment = "rscode is one window. These settings choose how a second window opens or is laid out: window.nativeTabs (macOS window tabs), window.newWindowDimensions, window.zoomPerWindow."
match = ["window.nativeTabs", "window.newWindowDimensions", "window.zoomPerWindow"]

[[rule]]
status = "blocked"
reason = "needs window state (full screen) in the session store"
comment = "window.restoreWindows is wired (one window: none against the rest, ADR-0040). Restoring the full screen state needs the window state saved with the session, and gpui-pre has no full screen query yet."
match = ["window.restoreFullscreen"]

[[rule]]
status = "n/a"
reason = "configures walkthroughs, which come from extensions and the web"
comment = "The Welcome page of rscode (ADR-0040) has no walkthroughs, so the settings that open them on install, reduce their motion or switch the experimental onboarding do not apply."
match = ["workbench.welcomePage.*"]

[[rule]]
status = "blocked"
reason = "needs windows without a folder (rscode always opens a folder)"
comment = "window.closeWhenEmpty only applies to windows that show no folder. rscode always has a folder, so it has no effect yet."
match = ["window.closeWhenEmpty"]

[[rule]]
status = "blocked"
reason = "needs a confirm dialog (modal) before closing the window"
comment = "window.confirmBeforeClose asks before closing or quitting with unsaved changes. rscode has no modal dialog yet."
match = ["window.confirmBeforeClose", "window.dialogStyle"]

[[rule]]
status = "blocked"
reason = "needs context menus (rscode has none yet)"
comment = "window.menuStyle chooses the look of context menus (native or custom). rscode has no context menus yet."
match = ["window.menuStyle"]

[[rule]]
status = "blocked"
reason = "needs a theme service (system light and dark modes, high contrast themes)"
comment = "Colour mode and high contrast themes are chosen by the theme service. rscode has one built-in theme (theme.rs)."
match = ["window.autoDetectColorScheme", "window.autoDetectHighContrast", "window.systemColorTheme"]

[[rule]]
status = "blocked"
reason = "needs untitled workspace files (multi-root workspaces)"
comment = "window.confirmSaveUntitledWorkspace asks about an untitled .code-workspace when switching workspaces. rscode opens folders only."
match = ["window.confirmSaveUntitledWorkspace"]

[[rule]]
status = "blocked"
reason = "needs a native title bar and a full screen mode"
comment = "window.customTitleBarVisibility hides the custom title bar in full screen or with a native title bar. rscode always draws its title bar and has no full screen command yet."
match = ["window.customTitleBarVisibility", "window.nativeFullScreen"]

[[rule]]
status = "blocked"
reason = "needs first-mouse click handling for inactive windows (gpui accepts the first click)"
comment = "window.clickThroughInactive: with it off, the first click on an inactive window only activates it. gpui-apple accepts the first mouse always, so the option needs a window setting there."
match = ["window.clickThroughInactive"]

[[rule]]
status = "blocked"
reason = "needs a native title bar mode (window options are fixed when the window opens)"
comment = "window.titleBarStyle native shows the system title bar. Upstream applies it only on restart; rscode sets its window options once, in main.rs, and draws a custom title bar."
match = ["window.titleBarStyle"]

[[rule]]
status = "blocked"
reason = "needs user profiles"
comment = "window.newWindowProfile picks the profile of a new window. rscode has no profiles."
match = ["window.newWindowProfile"]

[[rule]]
status = "blocked"
reason = "needs the modern UI layout (workbench.experimental.modernUI) and the Agents window"
comment = "window.density.layout changes the spacing of the modern UI and the Agents window only. rscode has neither yet."
match = ["window.density.layout"]

[[rule]]
status = "blocked"
reason = "needs notification toasts and the notifications centre"
comment = "Toast position and the title bar notifications button. rscode shows a status bar bell only."
match = ["workbench.notifications.position", "workbench.notifications.showInTitleBar"]

[[rule]]
status = "blocked"
reason = "needs extension views (view containers)"
comment = "workbench.view.showQuietly shows a status bar item when an extension asks for a hidden view. rscode has no extension views yet (ADR-0020)."
match = ["workbench.view.showQuietly"]

[[rule]]
status = "blocked"
reason = "needs view header actions that show on hover and focus (they are always visible)"
comment = "workbench.view.alwaysShowHeaderActions: the Explorer and Search header actions are always visible, so there is nothing to hide until the hover behaviour exists."
match = ["workbench.view.alwaysShowHeaderActions"]

[[rule]]
status = "blocked"
reason = "needs hover widgets with a configurable delay (gpui tooltips use a fixed delay)"
comment = "workbench.hover.delay and reducedDelay apply to workbench hovers, such as extension tree items. rscode's tooltips use gpui's fixed delay."
match = ["workbench.hover.delay", "workbench.hover.reducedDelay"]

[[rule]]
status = "blocked"
reason = "needs workbench animations and translucent surfaces (there are none yet)"
comment = "reduceMotion and reduceTransparency tone down animations and blur. rscode has neither yet, so they would do nothing."
match = ["workbench.reduceMotion", "workbench.reduceTransparency"]

[[rule]]
status = "blocked"
reason = "needs shadows on floating surfaces (menus and pop-ups) and the modern UI frosted glass"
comment = "workbench.shadows draws shadows around side panels and pop-ups; the modern UI frosted glass settings blur pop-up backgrounds. rscode's pop-ups have no shadow or blur yet."
match = ["workbench.shadows", "workbench.modernUIFrostedGlass", "workbench.modernUIFrostedGlassOpacity"]

[[rule]]
status = "blocked"
reason = "needs font smoothing control in gpui (text rendering)"
comment = "workbench.fontAliasing picks the font smoothing method. gpui uses the system default; the setting needs a text rendering option."
match = ["workbench.fontAliasing"]

[[rule]]
status = "blocked"
reason = "needs the title bar navigation and layout controls"
comment = "workbench.navigationControl (Go Back / Forward) needs navigation history; workbench.layoutControl (toggle buttons and a layout menu) needs the layout controls in the title bar. Neither exists yet."
match = ["workbench.navigationControl.enabled", "workbench.layoutControl.enabled", "workbench.layoutControl.type"]

[[rule]]
status = "blocked"
reason = "needs watermark tips for the empty editor"
comment = "workbench.tips.enabled shows tips on the empty editor. rscode shows the empty editor hint (workbench.editor.empty.hint) only."
match = ["workbench.tips.enabled"]

[[rule]]
status = "blocked"
reason = "needs a theme service (theme switching, icon, product icon and colour overrides)"
comment = "workbench.colorTheme, iconTheme, productIconTheme and colorCustomizations pick or override themes. rscode has one built-in theme (theme.rs), with no theme registry."
match = ["workbench.colorTheme", "workbench.iconTheme", "workbench.productIconTheme", "workbench.colorCustomizations"]

[[rule]]
status = "blocked"
reason = "needs link opening (external browser and URI openers)"
comment = "workbench.externalBrowser, externalUriOpeners and trustedDomains.promptInTrustedWorkspace decide how http links open. rscode opens no links yet."
match = ["workbench.externalBrowser", "workbench.externalUriOpeners", "workbench.trustedDomains.promptInTrustedWorkspace"]

[[rule]]
status = "blocked"
reason = "needs a remote indicator in the status bar (remote development)"
comment = "workbench.remoteIndicator.showExtensionRecommendations offers remote extensions in the remote indicator. rscode is local only so far."
match = ["workbench.remoteIndicator.showExtensionRecommendations"]

[[rule]]
status = "blocked"
reason = "needs custom editors for diff views"
comment = "workbench.diffEditorAssociations maps file patterns to editors for diff views. rscode has no diff editor or custom editors yet."
match = ["workbench.diffEditorAssociations"]

# ---------------------------------------------------------------------------------------------
# rscode component map for `next` briefs (first match wins; match is against the group id).
# ---------------------------------------------------------------------------------------------

[[rule]]
status = "blocked"
reason = "needs language features (completion provider + suggest widget, via the extension host)"
comment = "Suggest/autocomplete: providers come from language extensions on the Node extension host (ADR-0020). Word-based suggestions also need the suggest widget."
match = ["editor.suggest*", "editor.quickSuggestions*", "editor.acceptSuggestionOnEnter", "editor.acceptSuggestionOnCommitCharacter",
         "editor.snippetSuggestions", "editor.wordBasedSuggestions*", "editor.tabCompletion", "editor.inlineSuggest*",
         "editor.parameterHints*"]

[[rule]]
status = "blocked"
reason = "needs language features (definition / hover / code lens / inlay hint providers, via the extension host)"
comment = "Go to Definition / peek, hover, code lens, inlay hints, light bulb, semantic highlighting: all provider-driven (ADR-0020)."
match = ["editor.gotoLocation*", "editor.hover*", "editor.codeLens*", "editor.inlayHints*", "editor.lightbulb*",
         "editor.semanticHighlighting*", "editor.definitionLinkOpensInPeek"]

[[rule]]
status = "blocked"
reason = "needs folding regions and section markers"
comment = "Minimap section headers read `#region` / MARK comments; needs folding ranges and comment tokens."
match = ["editor.minimap.showRegionSectionHeaders", "editor.minimap.showMarkSectionHeaders", "editor.minimap.markSectionHeaderRegex",
         "editor.minimap.sectionHeaderFontSize", "editor.minimap.sectionHeaderLetterSpacing"]

# ---------------------------------------------------------------------------------------------
# files.* (ADR-0034). The files settings that are wired live in config/wired.rs. The ones below are
# status `blocked`: each needs a feature rscode does not have yet. Delete the rule when the feature
# lands. The reasons say what is missing.

[[rule]]
status = "blocked"
reason = "needs untitled editors (new files)"
comment = "files.defaultLanguage is the language of a new untitled file. The language registry exists (ADR-0038, files.associations is wired), but rscode has no untitled editors yet."
match = ["files.defaultLanguage"]

[[rule]]
status = "blocked"
reason = "needs text encodings other than UTF-8 (detection, decoding on open, encoding on save)"
comment = "rscode reads and writes UTF-8 (invalid bytes are replaced on read). Encoding and the guess settings need decoding on open and encoding on save; encoding_rs is already in the dependency tree."
match = ["files.encoding", "files.candidateGuessEncodings", "files.autoGuessEncoding"]

[[rule]]
status = "blocked"
reason = "needs diagnostics (problems reported by language features)"
comment = "autoSaveWhenNoErrors skips the auto save of a file with errors in it. rscode has no diagnostics yet (the status bar shows 0 errors)."
match = ["files.autoSaveWhenNoErrors"]

[[rule]]
status = "blocked"
reason = "needs watching of symlinked folders (watcherInclude adds paths the watcher does not follow)"
comment = "rscode's watcher covers the workspace recursively (ADR-0039) and does not follow symbolic links. watcherExclude is wired; watcherInclude is not."
match = ["files.watcherInclude"]

[[rule]]
status = "blocked"
reason = "needs the undo history saved with the backup"
comment = "files.hotExit is wired (ADR-0040): unsaved text is backed up and restored. restoreUndoStack would also store the undo stack in the backup; rscode restores the text only, undo goes back to the file on disk."
match = ["files.restoreUndoStack"]

[[rule]]
status = "blocked"
reason = "needs the Explorer Delete command (the workbench deletes to the Trash; no command or key reaches it yet)"
comment = "enableTrash moves deleted files to the macOS Trash (ADR-0039). The workbench honours it; the Delete key and the context menu come with the explorer's inline editing."
match = ["files.enableTrash"]

[[rule]]
status = "blocked"
reason = "needs file dialogs (open folder, save as)"
comment = "dialog.defaultPath sets where file dialogs open, and simpleDialog.enable picks the in-app dialog over the native one. rscode has no file dialog yet."
match = ["files.dialog.defaultPath", "files.simpleDialog.enable"]

[[rule]]
status = "blocked"
reason = "needs file participants (create, rename, delete) from the extension host"
comment = "The timeout for extension file participants. No create, rename or delete runs participants yet (ADR-0020)."
match = ["files.participants.timeout"]

[[rule]]
status = "blocked"
reason = "needs refactoring edits from language features (rename, code actions)"
comment = "Saves the files that a refactoring changed. rscode has no refactorings (no language features)."
match = ["files.refactoring.autoSave"]

[[rule]]
status = "blocked"
reason = "needs Unicode word segmentation (UAX #29 / ICU) in the editing core"
comment = "editor.wordSegmenterLocales picks the Intl.Segmenter locales for word moves and double-click in CJK text. vsr-editor classifies characters by editor.wordSeparators only; a segmenter dependency (unicode-segmentation or ICU4X) has to land first."
match = ["editor.wordSegmenterLocales"]

[[component]]
match = ["editor", "editor.*", "diffEditor*", "multiDiffEditor*"]
path = "crates/vsr-app/src/editor_view.rs (and crates/vsr-editor / vsr-text for behaviour)"

[[component]]
match = ["keyboard*", "*keybinding*"]
path = "crates/vsr-app/src/keymap.rs"

[[component]]
match = ["workbench.colorTheme*", "workbench.*color*", "workbench.*font*", "workbench.iconTheme*"]
path = "crates/vsr-app/src/theme.rs"

[[component]]
match = ["workbench.settings*", "settings*"]
path = "crates/vsr-app/src/settings_view.rs"

[[component]]
match = ["files*", "explorer*", "search*", "outline*", "breadcrumbs*", "workbench*", "window*", "zenMode*", "terminal*", "debug*", "scm*", "git*", "task*"]
path = "crates/vsr-app/src/ui.rs (no dedicated module yet; create one when the first setting in this group lands)"

[[component]]
match = ["*"]
path = "crates/vsr-app/src/ui.rs"
