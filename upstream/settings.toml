# Settings port policy: read by scripts/settings-port (see docs/settings-migration.md).
#
# This file is the only place where we decide what a setting means for rscode. Every n/a,
# priority and grouping choice below is a POLICY decision the user should review. Keep the
# subset of TOML simple: tables, [[arrays of tables]], strings, string arrays, ints, bools.
#
# Status precedence per setting: wired (crates/vsr-app/src/config/wired.rs) > first matching
# [[rule]] > deprecated policy > exthost (contributed by a built-in extension) > todo.
# A [[rule]] sets its status to one of: n/a, blocked, exthost, todo (the script rejects others).
# Use n/a and blocked for the two cases below; exthost and todo exist only to override a rule.
#   n/a      never applies to rscode (Windows/Linux-only, telemetry, web-only, deprecated, AI chat
#            policy). A decision, not a backlog item. Never used for deferred work.
#   blocked  deferred: applies to rscode later, but needs a feature that does not exist yet. Not
#            actionable (`next` skips it) and counted separately, so the backlog stays honest.
#            The reason says what it needs ("needs editor splits and editor groups").
# Patterns are upstream-style globs: `*` is a wildcard, case-insensitive, whole key.
# Rule `match` is against the setting key; `source` (optional) against the export's source.
# Unblocking: when the feature lands, delete the blocked rule (the settings become todo), or
# change its status to "todo" to keep the settings as work without a rule.

[upstream]
# The clone is read from its working tree at the pinned commit (UPSTREAM.md).
clone = "../vscode-original"
pinned = "50e1350fc78df67b11049b903d96b530f28d26a5"

[policy]
# Settings marked `deprecated` upstream (165 keys) are n/a. Change to "todo" to implement them.
deprecated = "n/a"

[priority]
# P1: visible in everyday editing (editor basics, files, explorer, search, layout, window chrome).
# Commonly Used settings are P1 regardless of this list.
p1 = [
  "editor.font", "editor.cursor", "editor.tab", "editor.word", "editor.format", "editor.find",
  "editor.render", "editor.minimap", "editor.suggest", "editor.hover", "editor.folding",
  "editor.scroll", "editor.stickyScroll", "editor.gotoLocation", "editor.guides",
  "editor.selection", "files", "files.*", "explorer", "explorer.*", "search", "search.*",
  "workbench.activityBar", "workbench.sash", "workbench.editor", "workbench.commandPalette",
  "window", "breadcrumbs.show", "outline.show",
]# P3: niche, preview/experimental or language-specific tooling nobody needs first.
p3 = [
  "*.experimental", "*experimental*", "mergeEditor", "multiDiffEditor", "imageCarousel",
  "mediaPreview", "timeline", "references", "grunt", "gulp", "jake", "php*", "ipynb",
  "simpleBrowser", "notebook*", "interactiveWindow", "emmet*", "npm*", "merge-conflict",
  "screencastMode", "comments", "testing*", "markdown-mermaid", "markdown-math", "jsts-chat-features",
  "diffEditor*", "multiDiffEditor*",
]

# Group overrides: first match wins. Default grouping is `a.b` or `a.<word>` (see
# assign_groups in the script). Example: [[group]] match = ["editor.wordWrap*"] id = "editor.wrap"
# Keep the list empty until a group is clearly wrong.

# ---------------------------------------------------------------------------------------------
# n/a rules. Each reason is listed so the user can review it. Explicit key lists are preferred
# over broad globs wherever a glob would catch a setting we do want.
# ---------------------------------------------------------------------------------------------

[[rule]]
status = "n/a"
reason = "windows-only setting"
comment = "Keys with a .windows suffix (profiles, env) or a Windows-only name. macOS and Linux do not read them."
match = ["*.windows", "terminal.integrated.windowsUseConptyDll", "terminal.integrated.windowsReparentConsoleWindow",
         "terminal.integrated.enableWin32InputMode", "terminal.integrated.suggest.windowsExecutableExtensions",
         "git.ignoreWindowsGit27Warning", "terminal.external.windowsExec"]

[[rule]]
status = "n/a"
reason = "no effect on macOS (upstream description)"
comment = "Menubar mnemonics (Alt+F). The upstream description says it does nothing on macOS."
match = ["terminal.integrated.allowMnemonics"]

[[rule]]
status = "n/a"
reason = "linux-only setting"
comment = "Keys with a .linux suffix, plus the Linux external-terminal exec."
match = ["*.linux", "terminal.external.linuxExec"]

[[rule]]
status = "n/a"
reason = "web-only"
comment = "Web worker extension host and the web variant of the TypeScript server; rscode is desktop-only (ADR-0019)."
match = ["extensions.webWorker", "*tsserver.web.*"]

[[rule]]
status = "n/a"
reason = "telemetry (rscode ships none)"
comment = "No telemetry pipeline is planned; the settings would configure nothing."
match = ["telemetry.*"]

[[rule]]
status = "blocked"
reason = "needs multi-line selection matches"
comment = "editor.selectionHighlightMultiline. The default (false) matches upstream: a multi-line selection is not highlighted. Setting it to true has no effect yet; the highlight search is per line (ADR-0032)."
match = ["editor.selectionHighlightMultiline"]

[[rule]]
status = "n/a"
reason = "auto-update (product)"
comment = "rscode has no updater; update channels are a product service."
match = ["update.*"]

[[rule]]
status = "n/a"
reason = "remote development / tunnels (out of scope)"
comment = "Remote and tunnel features are not planned; ADR-0019 scopes rscode to local desktop."
match = ["remote.*", "debug.javascript.automaticallyTunnelRemoteServer"]

[[rule]]
status = "n/a"
reason = "settings sync (product service)"
comment = "Cloud settings sync is a Microsoft account service."
match = ["settingsSync.*"]

[[rule]]
status = "n/a"
reason = "AI chat, agents and copilot (product)"
comment = "rscode does not ship Copilot or chat. Accessibility signals named chat* stay todo (they are under accessibility.*)."
match = ["chat.*", "inlineChat.*", "mcp.*", "agents.*", "sessions.*", "dictation.*", "github.*",
         "github-enterprise.*", "onboarding.*", "accessibility.verbosity.browserElementCommenting"]

[[rule]]
status = "n/a"
reason = "accounts, sign-in, cloud and issue reporter (product)"
comment = "Account and sign-in UI belongs to the product services; the issue reporter is hidden on desktop."
match = ["workbench.accounts.*", "workbench.cloudChanges.*", "workbench.experimental.cloudChanges.*", "issueReporter.*"]

[[rule]]
status = "n/a"
reason = "integrated browser (product feature; revisit)"
comment = "workbench.browser.* configures the built-in browser pane, a product feature. Revisit if rscode gets one."
match = ["workbench.browser.*"]

[[rule]]
status = "n/a"
reason = "sign-in and Microsoft/GitHub account extensions (product)"
comment = "Extension-contributed settings from the GitHub and Microsoft authentication and sign-in extensions."
source = ["vscode.github", "vscode.github-authentication", "vscode.github-enterprise*", "vscode.microsoft-authentication",
          "vscode.microsoft-sovereign-cloud", "TypeScriptTeam.jsts-chat-features"]

# ---------------------------------------------------------------------------------------------
# workbench.editor (Editor management, ADR-0033). The settings below are status `blocked`: they
# need a feature rscode does not have yet, so they are deferred, not declined. Each reason says
# what it needs ("needs ..."). When that feature lands, delete the rule (or set it to "todo") so
# the settings enter the backlog. The wired ones are in config/wired.rs and need no rule.
# ---------------------------------------------------------------------------------------------

[[rule]]
status = "n/a"
reason = "AI chat, agents and copilot (product)"
comment = "The Agents window's Markdown editor default. rscode has no Agents window."
match = ["workbench.editor.markdownDefaultEditorInAgentsWindow"]

[[rule]]
status = "blocked"
reason = "needs editor splits and editor groups (one group in rscode)"
comment = "Multi-group behaviour: a single editor group exists, so these have no observable effect yet. closeEmptyGroups and autoLockGroups apply to groups; revealIfOpen only matters across groups; openSideBySideDirection needs splits; doubleClickTabToToggleEditorGroupSizes resizes groups."
match = ["workbench.editor.closeEmptyGroups", "workbench.editor.autoLockGroups", "workbench.editor.revealIfOpen",
         "workbench.editor.openSideBySideDirection", "workbench.editor.doubleClickTabToToggleEditorGroupSizes",
         "workbench.editor.sharedViewState", "workbench.editor.limit.perEditorGroup"]

[[rule]]
status = "blocked"
reason = "needs editor top padding for the Find widget (view zone)"
comment = "addExtraSpaceOnTop adds a view zone above the first line while the Find widget is open, so the widget does not cover the match at the top. rscode draws the widget over the text and the editor has no top padding that the hit-testing and scrolling would agree with (ADR-0027)."
match = ["editor.find.addExtraSpaceOnTop"]

[[rule]]
status = "blocked"
reason = "needs navigation history (Go Back / Go Forward)"
comment = "Needs a navigation history of editor positions. Mouse buttons 4 and 5, three-finger swipe and the scope of history navigation all depend on it."
match = ["workbench.editor.mouseBackForwardToNavigate", "workbench.editor.swipeToNavigate", "workbench.editor.navigationScope"]

[[rule]]
status = "blocked"
reason = "needs binary, custom and large-file editors"
comment = "rscode has no binary editor, custom editor associations or large-file confirmation dialog yet. Untitled texts exist (ADR-0058); workbench.editor.untitled.labelFormat is wired (ADR-0059)."
match = ["workbench.editor.defaultBinaryEditor", "workbench.editorAssociations",
         "workbench.editorLargeFileConfirmation", "workbench.editor.hiddenEditorTypes", "workbench.editor.useModal"]

[[rule]]
status = "blocked"
reason = "needs language detection for untitled and unknown files"
comment = "No language detection service. Untitled texts exist (ADR-0058), but rscode detects no language from their contents or from the files it opens."
match = ["workbench.editor.languageDetection", "workbench.editor.historyBasedLanguageDetection",
         "workbench.editor.preferHistoryBasedLanguageDetection", "workbench.editor.languageDetectionHints"]

[[rule]]
status = "blocked"
reason = "needs tab strip presentation (scrollbars, wrapping, pinned tabs, actions)"
comment = "The tab strip is one scrollless row with close buttons only. Pinned tabs can be made (double click) but not sized or placed differently yet; the title scrollbar and editor title actions do not exist."
match = ["workbench.editor.titleScrollbarSizing", "workbench.editor.titleScrollbarVisibility", "workbench.editor.wrapTabs",
         "workbench.editor.pinnedTabSizing", "workbench.editor.pinnedTabsOnSeparateRow", "workbench.editor.preventPinnedEditorClose",
         "workbench.editor.editorActionsLocation", "workbench.editor.alwaysShowEditorActions",
         "workbench.editor.centeredLayoutAutoResize", "workbench.editor.centeredLayoutFixedWidth"]

[[rule]]
status = "blocked"
reason = "needs file decorations and custom tab labels"
comment = "Decorations need the SCM and problems services (git status and diagnostics colours and badges). customLabels.patterns needs a label service."
match = ["workbench.editor.decorations.badges", "workbench.editor.decorations.colors", "workbench.editor.customLabels.enabled",
         "workbench.editor.customLabels.patterns"]

[[rule]]
status = "blocked"
reason = "needs multi-window support (dragging out opens a window)"
comment = "Dragging an editor out of the window opens a new window; rscode is one window."
match = ["workbench.editor.dragToOpenWindow"]

# ---------------------------------------------------------------------------------------------
# window and workbench (window chrome and general workbench, ADR-0035). Wired ones are in
# config/wired.rs and take precedence. The rest are blocked on a feature rscode does not have.
# ---------------------------------------------------------------------------------------------

[[rule]]
status = "n/a"
reason = "fetches Microsoft online experiments (product service)"
comment = "workbench.enableExperiments asks Microsoft's experiment service which experiments to run. rscode has no such service and will not use it."
match = ["workbench.enableExperiments"]

[[rule]]
status = "n/a"
reason = "application icon in the custom title bar is shown on Windows and Linux only"
comment = "window.doubleClickIconToClose acts on the app icon. Upstream creates that icon only when isWindows || isLinux (titlebarPart.ts), so it never applies on macOS."
match = ["window.doubleClickIconToClose"]

[[rule]]
status = "blocked"
reason = "needs multi-window support (native window tabs, several windows, zoom and size per window)"
comment = "rscode is one window. These settings choose how a second window opens or is laid out: window.nativeTabs (macOS window tabs), window.newWindowDimensions, window.zoomPerWindow."
match = ["window.nativeTabs", "window.newWindowDimensions", "window.zoomPerWindow"]

[[rule]]
status = "blocked"
reason = "needs window state (full screen) in the session store"
comment = "window.restoreWindows is wired (one window: none against the rest, ADR-0040). Restoring the full screen state needs the window state saved with the session, and gpui-pre has no full screen query yet."
match = ["window.restoreFullscreen"]

[[rule]]
status = "n/a"
reason = "configures walkthroughs, which come from extensions and the web"
comment = "The Welcome page of rscode (ADR-0040) has no walkthroughs, so the settings that open them on install, reduce their motion or switch the experimental onboarding do not apply."
match = ["workbench.welcomePage.*"]

[[rule]]
status = "blocked"
reason = "needs windows without a folder (rscode always opens a folder)"
comment = "window.closeWhenEmpty only applies to windows that show no folder. rscode always has a folder, so it has no effect yet."
match = ["window.closeWhenEmpty"]

[[rule]]
status = "blocked"
reason = "needs a confirm dialog (modal) before closing the window"
comment = "window.confirmBeforeClose asks before closing or quitting with unsaved changes. rscode has no modal dialog yet."
match = ["window.confirmBeforeClose", "window.dialogStyle"]

[[rule]]
status = "blocked"
reason = "needs context menus (rscode has none yet)"
comment = "window.menuStyle chooses the look of context menus (native or custom). rscode has no context menus yet."
match = ["window.menuStyle"]

[[rule]]
status = "blocked"
reason = "needs the OS high contrast signal and a native window appearance override"
comment = "window.autoDetectHighContrast and the preferred high contrast themes switch to a high contrast theme when the OS uses one; gpui exposes no high contrast signal (the theme service takes it as input, ADR-0037). window.systemColorTheme sets the colour mode of native window chrome (NSApplication appearance), which rscode does not drive."
match = ["window.autoDetectHighContrast", "window.systemColorTheme", "workbench.preferredHighContrastColorTheme", "workbench.preferredHighContrastLightColorTheme"]

[[rule]]
status = "blocked"
reason = "needs untitled workspace files (multi-root workspaces)"
comment = "window.confirmSaveUntitledWorkspace asks about an untitled .code-workspace when switching workspaces. rscode opens folders only."
match = ["window.confirmSaveUntitledWorkspace"]

[[rule]]
status = "blocked"
reason = "needs a native title bar and a full screen mode"
comment = "window.customTitleBarVisibility hides the custom title bar in full screen or with a native title bar. rscode always draws its title bar and has no full screen command yet."
match = ["window.customTitleBarVisibility", "window.nativeFullScreen"]

[[rule]]
status = "blocked"
reason = "needs first-mouse click handling for inactive windows (gpui accepts the first click)"
comment = "window.clickThroughInactive: with it off, the first click on an inactive window only activates it. gpui-apple accepts the first mouse always, so the option needs a window setting there."
match = ["window.clickThroughInactive"]

[[rule]]
status = "blocked"
reason = "needs a native title bar mode (window options are fixed when the window opens)"
comment = "window.titleBarStyle native shows the system title bar. Upstream applies it only on restart; rscode sets its window options once, in main.rs, and draws a custom title bar."
match = ["window.titleBarStyle"]

[[rule]]
status = "blocked"
reason = "needs user profiles"
comment = "window.newWindowProfile picks the profile of a new window. rscode has no profiles."
match = ["window.newWindowProfile"]

[[rule]]
status = "blocked"
reason = "needs the modern UI layout (workbench.experimental.modernUI) and the Agents window"
comment = "window.density.layout changes the spacing of the modern UI and the Agents window only. rscode has neither yet."
match = ["window.density.layout"]

[[rule]]
status = "blocked"
reason = "needs notification toasts and the notifications centre"
comment = "Toast position and the title bar notifications button. rscode shows a status bar bell only."
match = ["workbench.notifications.position", "workbench.notifications.showInTitleBar"]

[[rule]]
status = "blocked"
reason = "needs extension views (view containers)"
comment = "workbench.view.showQuietly shows a status bar item when an extension asks for a hidden view. rscode has no extension views yet (ADR-0020)."
match = ["workbench.view.showQuietly"]

[[rule]]
status = "blocked"
reason = "needs view header actions that show on hover and focus (they are always visible)"
comment = "workbench.view.alwaysShowHeaderActions: the Explorer and Search header actions are always visible, so there is nothing to hide until the hover behaviour exists."
match = ["workbench.view.alwaysShowHeaderActions"]

[[rule]]
status = "blocked"
reason = "needs hover widgets with a configurable delay (gpui tooltips use a fixed delay)"
comment = "workbench.hover.delay and reducedDelay apply to workbench hovers, such as extension tree items. rscode's tooltips use gpui's fixed delay."
match = ["workbench.hover.delay", "workbench.hover.reducedDelay"]

[[rule]]
status = "blocked"
reason = "needs workbench animations and translucent surfaces (there are none yet)"
comment = "reduceMotion and reduceTransparency tone down animations and blur. rscode has neither yet, so they would do nothing."
match = ["workbench.reduceMotion", "workbench.reduceTransparency"]

[[rule]]
status = "blocked"
reason = "needs shadows on floating surfaces (menus and pop-ups) and the modern UI frosted glass"
comment = "workbench.shadows draws shadows around side panels and pop-ups; the modern UI frosted glass settings blur pop-up backgrounds. rscode's pop-ups have no shadow or blur yet."
match = ["workbench.shadows", "workbench.modernUIFrostedGlass", "workbench.modernUIFrostedGlassOpacity"]

[[rule]]
status = "blocked"
reason = "needs font smoothing control in gpui (text rendering)"
comment = "workbench.fontAliasing picks the font smoothing method. gpui uses the system default; the setting needs a text rendering option."
match = ["workbench.fontAliasing"]

[[rule]]
status = "blocked"
reason = "needs the title bar navigation and layout controls"
comment = "workbench.navigationControl (Go Back / Forward) needs navigation history; workbench.layoutControl (toggle buttons and a layout menu) needs the layout controls in the title bar. Neither exists yet."
match = ["workbench.navigationControl.enabled", "workbench.layoutControl.enabled", "workbench.layoutControl.type"]

[[rule]]
status = "blocked"
reason = "needs watermark tips for the empty editor"
comment = "workbench.tips.enabled shows tips on the empty editor. rscode shows the empty editor hint (workbench.editor.empty.hint) only."
match = ["workbench.tips.enabled"]

[[rule]]
status = "blocked"
reason = "needs file icon themes"
comment = "workbench.iconTheme and productIconTheme pick the file icon and product icon themes. rscode has the codicon font only and no file icons (the colour theme service is done: ADR-0037)."
match = ["workbench.iconTheme", "workbench.productIconTheme"]

[[rule]]
status = "blocked"
reason = "needs link opening (external browser and URI openers)"
comment = "workbench.externalBrowser, externalUriOpeners and trustedDomains.promptInTrustedWorkspace decide how http links open. rscode opens no links yet."
match = ["workbench.externalBrowser", "workbench.externalUriOpeners", "workbench.trustedDomains.promptInTrustedWorkspace"]

[[rule]]
status = "blocked"
reason = "needs a remote indicator in the status bar (remote development)"
comment = "workbench.remoteIndicator.showExtensionRecommendations offers remote extensions in the remote indicator. rscode is local only so far."
match = ["workbench.remoteIndicator.showExtensionRecommendations"]

[[rule]]
status = "blocked"
reason = "needs custom editors for diff views"
comment = "workbench.diffEditorAssociations maps file patterns to editors for diff views. rscode has no diff editor or custom editors yet."
match = ["workbench.diffEditorAssociations"]

# ---------------------------------------------------------------------------------------------
# rscode component map for `next` briefs (first match wins; match is against the group id).
# ---------------------------------------------------------------------------------------------

[[rule]]
status = "blocked"
reason = "needs language features (completion provider + suggest widget, via the extension host)"
comment = "Suggest/autocomplete: providers come from language extensions on the Node extension host (ADR-0020). Word-based suggestions also need the suggest widget."
match = ["editor.suggest*", "editor.quickSuggestions*", "editor.acceptSuggestionOnEnter", "editor.acceptSuggestionOnCommitCharacter",
         "editor.snippetSuggestions", "editor.wordBasedSuggestions*", "editor.tabCompletion", "editor.inlineSuggest*",
         "editor.parameterHints*"]

[[rule]]
status = "blocked"
reason = "needs language features (definition / hover / code lens / inlay hint providers, via the extension host)"
comment = "Go to Definition / peek, hover, code lens, inlay hints, light bulb, semantic highlighting: all provider-driven (ADR-0020)."
match = ["editor.gotoLocation*", "editor.hover*", "editor.codeLens*", "editor.inlayHints*", "editor.lightbulb*",
         "editor.semanticHighlighting*", "editor.definitionLinkOpensInPeek"]

[[rule]]
status = "blocked"
reason = "needs letter spacing in the text system (gpui has none)"
comment = "editor.minimap.sectionHeaderLetterSpacing: upstream paints the section header into the minimap canvas with a letter spacing; rscode draws the title as a text label and gpui text has no letter spacing. The other section header settings are wired (ADR-0042)."
match = ["editor.minimap.sectionHeaderLetterSpacing"]

[[rule]]
status = "blocked"
reason = "needs language server folding range providers (import ranges)"
comment = "editor.foldingImportsByDefault collapses the ranges of kind `imports`, which only a folding range provider reports. rscode computes indentation and marker ranges only (ADR-0042); editor.foldingStrategy `auto` therefore behaves as `indentation`."
match = ["editor.foldingImportsByDefault"]

# ---------------------------------------------------------------------------------------------
# files.* (ADR-0034). The files settings that are wired live in config/wired.rs. The ones below are
# status `blocked`: each needs a feature rscode does not have yet. Delete the rule when the feature
# lands. The reasons say what is missing.

[[rule]]
status = "blocked"
reason = "needs text encodings other than UTF-8 (detection, decoding on open, encoding on save)"
comment = "rscode reads and writes UTF-8 (invalid bytes are replaced on read). Encoding and the guess settings need decoding on open and encoding on save; encoding_rs is already in the dependency tree."
match = ["files.encoding", "files.candidateGuessEncodings", "files.autoGuessEncoding"]

[[rule]]
status = "blocked"
reason = "needs diagnostics (problems reported by language features)"
comment = "autoSaveWhenNoErrors skips the auto save of a file with errors in it. rscode has no diagnostics yet (the status bar shows 0 errors)."
match = ["files.autoSaveWhenNoErrors"]

[[rule]]
status = "blocked"
reason = "needs watching of symlinked folders (watcherInclude adds paths the watcher does not follow)"
comment = "rscode's watcher covers the workspace recursively (ADR-0039) and does not follow symbolic links. watcherExclude is wired; watcherInclude is not."
match = ["files.watcherInclude"]

[[rule]]
status = "blocked"
reason = "needs the undo history saved with the backup"
comment = "files.hotExit is wired (ADR-0040): unsaved text is backed up and restored. restoreUndoStack would also store the undo stack in the backup; rscode restores the text only, undo goes back to the file on disk."
match = ["files.restoreUndoStack"]

[[rule]]
status = "blocked"
reason = "needs Explorer copy, paste and duplicate (incremental names apply to duplicated items)"
comment = "explorer.incrementalNaming names a pasted or duplicated item that already exists (names.rs has the naming functions). rscode has no copy, paste or duplicate yet (ADR-0041)."
match = ["explorer.incrementalNaming"]

[[rule]]
status = "blocked"
reason = "needs file dialogs (open folder, save as)"
comment = "dialog.defaultPath sets where file dialogs open, and simpleDialog.enable picks the in-app dialog over the native one. rscode has no file dialog yet."
match = ["files.dialog.defaultPath", "files.simpleDialog.enable"]

[[rule]]
status = "blocked"
reason = "needs file participants (create, rename, delete) from the extension host"
comment = "The timeout for extension file participants. No create, rename or delete runs participants yet (ADR-0020)."
match = ["files.participants.timeout"]

[[rule]]
status = "blocked"
reason = "needs refactoring edits from language features (rename, code actions)"
comment = "Saves the files that a refactoring changed. rscode has no refactorings (no language features)."
match = ["files.refactoring.autoSave"]

[[rule]]
status = "blocked"
reason = "needs Unicode word segmentation (UAX #29 / ICU) in the editing core"
comment = "editor.wordSegmenterLocales picks the Intl.Segmenter locales for word moves and double-click in CJK text. vsr-editor classifies characters by editor.wordSeparators only; a segmenter dependency (unicode-segmentation or ICU4X) has to land first."
match = ["editor.wordSegmenterLocales"]

[[rule]]
status = "blocked"
reason = "needs formatting providers from the extension host"
comment = "Format on paste, type and save run a document or range formatter. Formatters are language extensions on the Node extension host (ADR-0020); rscode has no formatter of its own yet, so these settings have nothing to run."
match = ["editor.formatOnPaste", "editor.formatOnType", "editor.formatOnSave", "editor.formatOnSaveMode"]

[[rule]]
status = "blocked"
reason = "needs font variation axes in gpui text shaping"
comment = "gpui-pre 0.3.11 applies font features (OpenType tags) and the weight, not variable font axes. fontVariations: true would set wght from editor.fontWeight, and a string is font-variation-settings."
match = ["editor.fontVariations"]

[[rule]]
status = "n/a"
reason = "only with editor.editContext (the browser EditContext API)"
comment = "Rich screen reader content is the DOM mirror that the EditContext text input needs. rscode does not use EditContext: its text input is the platform input handler (ADR-0012), so the setting has no meaning here."
match = ["editor.renderRichScreenReaderContent"]

[[rule]]
status = "blocked"
reason = "needs ctrl+click (go to definition, multi-cursor) and link detection"
comment = "Middle click opens a link (openLink) or acts as ctrl+click (ctrlLeftClick). Links need link detection and ctrl+click needs go to definition or multi-cursor."
match = ["editor.mouseMiddleClickAction"]

[[rule]]
status = "blocked"
reason = "needs a scroll capture on the editor surface"
comment = "mouseWheelZoom (Cmd+wheel zooms the font) and mouseWheelScrollSensitivity (scales the wheel delta) must see the wheel before the list scrolls. gpui only offers bubble-phase scroll listeners, and the list scrolls itself first, so Cmd+wheel would also scroll."
match = ["editor.mouseWheelZoom", "editor.mouseWheelScrollSensitivity"]

[[rule]]
status = "blocked"
reason = "needs bracket pair guides (a pair model over the whole buffer)"
comment = "guides.bracketPairs, bracketPairsHorizontal and highlightActiveBracketPair draw the pairs of the whole document, skipping brackets in strings and comments. vsr-editor matches only the pair at the caret (matchBrackets, ADR-0032), so these need a pair scan driven by the syntax tokens (ADR-0038)."
match = ["editor.guides.bracketPairs", "editor.guides.bracketPairsHorizontal", "editor.guides.highlightActiveBracketPair"]

[[rule]]
status = "blocked"
reason = "needs caret animation (a tween of the caret across frames)"
comment = "cursorSmoothCaretAnimation moves the caret from its old position to the new one over a short time. The caret jumps now, and the blink timer is the only per-frame work."
match = ["editor.cursorSmoothCaretAnimation"]

# The general `editor` group and `editor.auto*` (ADR-0046). Wired: autoClosing* (5), autoSurround,
# autoIndent, detectIndentation, indentSize, useTabStops, trimAutoWhitespace, trimWhitespaceOnDelete,
# comments.insertSpace, comments.ignoreEmptyLines, emptySelectionClipboard. The rest, by what it needs:

[[rule]]
status = "blocked"
reason = "needs paste re-indentation (the AutoIndentOnPaste contribution)"
comment = "autoIndentOnPaste and autoIndentOnPasteWithinString re-indent pasted lines with getGoodIndentForLine (ported in vsr-languages/auto_indent.rs) after a paste. Paste is a plain insert in vsr-editor (`Editor::paste`); indentation.ts's paste handler is not ported."
match = ["editor.autoIndentOnPaste", "editor.autoIndentOnPasteWithinString"]

[[rule]]
status = "blocked"
reason = "needs atomic soft tab cursor moves in vsr-editor"
comment = "stickyTabStops makes Left, Right and a click inside space indentation jump over a whole indent unit (cursorAtomicMoveOperations.ts). vsr-editor moves by one character."
match = ["editor.stickyTabStops"]

[[rule]]
status = "blocked"
reason = "needs per-language setting scopes ([language] overrides) in the configuration service"
comment = "editor.language.brackets and editor.language.colorizedBracketPairs override the bracket pairs of the language being edited and are meant to be set under a [language] key. The bundled language configurations (ADR-0046) have the brackets; the override needs the language scope."
match = ["editor.language.brackets", "editor.language.colorizedBracketPairs"]

[[rule]]
status = "blocked"
reason = "needs bracket pair colorization (a pair model over the whole buffer)"
comment = "bracketPairColorization.* colour every bracket by its nesting depth. Same missing pair scan as the bracket pair guides (ADR-0043)."
match = ["editor.bracketPairColorization.enabled", "editor.bracketPairColorization.independentColorPoolPerBracketType"]

[[rule]]
status = "blocked"
reason = "needs screen reader support (an accessibility tree from gpui)"
comment = "accessibilitySupport, accessibilityPageSize and the two screen reader announcements configure the screen reader mode of the editor. gpui draws its own text and exposes no accessibility tree on macOS yet."
match = ["editor.accessibilitySupport", "editor.accessibilityPageSize", "editor.screenReaderAnnounceInlineSuggestion", "editor.inlineCompletionsAccessibilityVerbose"]

[[rule]]
status = "blocked"
reason = "needs multi-cursor editing (column selection creates a cursor per line)"
comment = "columnSelection turns mouse and key selection into rectangular selections, which are one cursor per line. vsr-editor has one cursor."
match = ["editor.columnSelection"]

[[rule]]
status = "blocked"
reason = "needs a rich clipboard (the HTML flavour with token colours)"
comment = "copyWithSyntaxHighlighting adds the highlighted HTML of the selection to the pasteboard next to the plain text. The clipboard here is plain text only."
match = ["editor.copyWithSyntaxHighlighting"]

[[rule]]
status = "blocked"
reason = "needs text drag and drop in the editor (dragging a selection with the mouse)"
comment = "dragAndDrop moves the selected text when it is dragged. The mouse handler only extends selections."
match = ["editor.dragAndDrop"]

[[rule]]
status = "n/a"
reason = "the EditContext API is a browser input path"
comment = "editContext chooses between a textarea and the browser EditContext API. rscode takes input from the platform text input handler (ADR-0018)."
match = ["editor.editContext"]

[[rule]]
status = "n/a"
reason = "touchpad inertia is a Linux setting"
comment = "inertialScroll is documented as mostly useful with a touchpad on Linux; macOS scrolls with inertia natively."
match = ["editor.inertialScroll"]

[[rule]]
status = "blocked"
reason = "needs a scroll capture on the editor surface"
comment = "fastScrollSensitivity scales the wheel delta while Alt is held (same missing scroll capture as mouseWheelScrollSensitivity, ADR-0043)."
match = ["editor.fastScrollSensitivity"]

[[rule]]
status = "blocked"
reason = "needs scroll animation (a tween of the scroll position across frames)"
comment = "smoothScrolling animates scrolls caused by keys and commands. Scroll position changes jump now."
match = ["editor.smoothScrolling"]

[[rule]]
status = "blocked"
reason = "needs the glyph margin (breakpoints and the code action lightbulb in the margin)"
comment = "glyphMargin reserves the margin for breakpoints and the code action lightbulb, which rscode does not draw. editor.overviewRulerBorder and hideCursorInOverviewRuler are wired (the overview ruler, ADR-0055)."
match = ["editor.glyphMargin"]

[[rule]]
status = "blocked"
reason = "needs letter spacing in gpui text (and full-width cell widths in the text layout)"
comment = "letterSpacing adds pixels between glyphs (the same gap as minimap.sectionHeaderLetterSpacing, ADR-0042); fullwidthCharacterWidth sets the cell width of full-width characters, which the layout takes from the shaped text."
match = ["editor.letterSpacing", "editor.fullwidthCharacterWidth"]

[[rule]]
status = "blocked"
reason = "needs link detection and Cmd+click (the link provider and opener)"
comment = "links makes URLs in the text clickable (linkComputer.ts is not ported); the same gap blocks mouseMiddleClickAction (ADR-0043)."
match = ["editor.links"]

[[rule]]
status = "blocked"
reason = "needs overtype input mode (the Insert key toggle) in vsr-editor"
comment = "overtypeCursorStyle styles the caret in overtype mode and overtypeOnPaste overwrites on paste; both need the mode itself (ReplaceOvertypeCommand), which typing does not have."
match = ["editor.overtypeCursorStyle", "editor.overtypeOnPaste"]

[[rule]]
status = "blocked"
reason = "needs top and bottom padding in the editor list (scroll height and hit testing)"
comment = "padding.top and padding.bottom add space above the first and below the last line; the uniform list, the minimap and the hit test all assume row 0 is at the top."
match = ["editor.padding.top", "editor.padding.bottom"]

[[rule]]
status = "blocked"
reason = "needs multi-cursor selection commands (Add Selection To Next Find Match) and selection match modes"
comment = "selectedTextMatchMode picks strict, word or case-insensitive matching for the selection highlight and for the next-occurrence commands. The highlight (selectionHighlight) matches as it did before the setting existed."
match = ["editor.selectedTextMatchMode"]

[[rule]]
status = "blocked"
reason = "needs Expand Selection (smart select) with selection range providers"
comment = "smartSelect.* tune the Expand and Shrink Selection commands, which are not implemented."
match = ["editor.smartSelect.selectLeadingAndTrailingWhitespace", "editor.smartSelect.selectSubwords"]

[[rule]]
status = "blocked"
reason = "needs the unusual line terminators prompt on open and save"
comment = "unusualLineTerminators removes or asks about LS and PS characters in a file. TextBuffer treats them as ordinary text."
match = ["editor.unusualLineTerminators"]

[[rule]]
status = "blocked"
reason = "needs wrapping at literal escaped line feeds in the wrap projection"
comment = "wrapOnEscapedLineFeeds is an experimental option of the monospace line breaks computer (ADR-0036); the port does not have the escaped-LF mode."
match = ["editor.wrapOnEscapedLineFeeds"]

[[rule]]
status = "blocked"
reason = "needs double click block selection in the mouse handler"
comment = "doubleClickSelectsBlock selects the content inside a bracket pair or quotes when double clicking next to one. A double click selects the word."
match = ["editor.doubleClickSelectsBlock"]

[[rule]]
status = "blocked"
reason = "needs large file mode (features switched off for very big files)"
comment = "largeFileOptimizations turns tokenization, folding, word wrap and the minimap off above 20 MB or 300,000 lines. rscode opens every file the same way."
match = ["editor.largeFileOptimizations"]

[[rule]]
status = "blocked"
reason = "needs language features (peek, rename, code actions and linked editing through the extension host)"
comment = "stablePeek, peekWidgetDefaultFocus, rename.enablePreview, codeActionWidget.*, codeActions.triggerOnFocusChange, snippets.codeActions.enabled and linkedEditing configure features that run on language server providers (ADR-0020)."
match = ["editor.stablePeek", "editor.peekWidgetDefaultFocus", "editor.rename.enablePreview", "editor.codeActionWidget.*", "editor.codeActions.triggerOnFocusChange",
         "editor.snippets.codeActions.enabled", "editor.linkedEditing"]

[[rule]]
status = "blocked"
reason = "needs semantic highlighting (semantic token providers via the extension host)"
comment = "semanticTokenColorCustomizations styles semantic tokens; the existing editor.semanticHighlighting.enabled rule has the same reason."
match = ["editor.semanticTokenColorCustomizations"]

[[rule]]
status = "n/a"
reason = "AI statistics (a product service)"
comment = "aiStats.enabled shows how much of the code AI wrote; rscode ships no AI features."
match = ["editor.aiStats.*"]

[[component]]
match = ["editor", "editor.*", "diffEditor*", "multiDiffEditor*"]
path = "crates/vsr-app/src/editor_view.rs (and crates/vsr-editor / vsr-text for behaviour)"

[[component]]
match = ["keyboard*", "*keybinding*"]
path = "crates/vsr-app/src/keymap.rs"

[[component]]
match = ["workbench.colorTheme*", "workbench.*color*", "workbench.*font*", "workbench.iconTheme*"]
path = "crates/vsr-app/src/theme.rs"

[[component]]
match = ["workbench.settings*", "settings*"]
path = "crates/vsr-app/src/settings_view.rs"

[[component]]
match = ["files*", "explorer*", "search*", "outline*", "breadcrumbs*", "workbench*", "window*", "zenMode*", "terminal*", "debug*", "scm*", "git*", "task*"]
path = "crates/vsr-app/src/ui.rs (no dedicated module yet; create one when the first setting in this group lands)"

[[component]]
match = ["*"]
path = "crates/vsr-app/src/ui.rs"

# Search and Explorer settings deferred behind a feature rscode does not have yet (settings
# migration, search and explorer groups). Each names what it needs; delete the rule when that lands.

[[rule]]
status = "blocked"
reason = "needs the search editor (search results in an editor tab)"
comment = "search.mode decides whether Find in Files and Find in Folder open the Search view or a search editor. rscode only has the Search view (ADR-0023)."
match = ["search.mode"]

[[rule]]
status = "blocked"
reason = "needs the macOS find pasteboard (the shared find clipboard)"
comment = "search.globalFindClipboard reads and writes the macOS find pasteboard. The Find widget has the same gap (editor.find.globalFindClipboard is not implemented either), so both wait for one NSPasteboard find-board binding."
match = ["search.globalFindClipboard"]

[[rule]]
status = "blocked"
reason = "needs the Search tree view (folders as a hierarchy)"
comment = "search.defaultViewMode: tree groups the results by folder. rscode has the list view only (search/model.rs); list is the default and is what rscode shows."
match = ["search.defaultViewMode"]

[[rule]]
status = "blocked"
reason = "needs actionbar placement by row width (search.actionsPosition auto)"
comment = "search.actionsPosition: right (the default) is what rscode draws. auto puts the actions right after the content on a wide view, which needs the responsive row layout of the Search view."
match = ["search.actionsPosition"]

[[rule]]
status = "blocked"
reason = "needs the Quick Search picker (search results in Quick Access)"
comment = "search.quickAccess.preserveInput restores the last text of the Quick Search picker. rscode's Quick Access has no search provider yet."
match = ["search.quickAccess.preserveInput"]

[[rule]]
status = "blocked"
reason = "needs notebook editors and notebook search"
comment = "search.experimental.closedNotebookRichContentResults shows rich notebook results for notebooks that are closed. rscode has no notebooks."
match = ["search.experimental.closedNotebookRichContentResults"]

[[rule]]
status = "blocked"
reason = "needs the extension host's findFiles API (extensions)"
comment = "search.experimental.useIgnoreFilesInFindFiles changes the legacy findFiles extension API, which only exists once the extension host runs extensions (ADR-0020)."
match = ["search.experimental.useIgnoreFilesInFindFiles"]

[[rule]]
status = "blocked"
reason = "needs AI search (semantic index and keyword suggestions)"
comment = "search.searchView.semanticSearchBehavior and keywordSuggestions depend on the semantic search index. rscode has no AI search."
match = ["search.searchView.semanticSearchBehavior", "search.searchView.keywordSuggestions"]

[[rule]]
status = "blocked"
reason = "needs file decorations and custom tab labels"
comment = "search.decorations.colors and badges colour and badge the file rows from the decoration service, which needs the SCM and problems services (see the editor rule above)."
match = ["search.decorations.colors", "search.decorations.badges", "explorer.decorations.colors", "explorer.decorations.badges"]

[[rule]]
status = "blocked"
reason = "needs drag and drop in the Explorer"
comment = "explorer.enableDragAndDrop moves files and folders by dragging them in the tree. rscode's tree has no drag and drop (copy, paste and move wait for it too)."
match = ["explorer.enableDragAndDrop"]

[[rule]]
status = "blocked"
reason = "needs undo for Explorer file operations"
comment = "explorer.enableUndo: undo of create, rename and delete in the Explorer. The Explorer's operations (ADR-0039) keep no undo stack yet."
match = ["explorer.enableUndo"]

[[rule]]
status = "blocked"
reason = "needs multi-root workspaces"
comment = "explorer.expandSingleFolderWorkspaces applies to multi-root workspaces that hold one folder. rscode opens one folder (see tests/e2e-scenarios/multiroot.md for the plan)."
match = ["explorer.expandSingleFolderWorkspaces"]

[[rule]]
status = "blocked"
reason = "needs drag and drop in the Explorer"
comment = "explorer.autoOpenDroppedFile opens a file that is dropped into the tree, and explorer.confirmDragAndDrop asks before a drag moves files. Both wait for drag and drop in the Explorer (see explorer.enableDragAndDrop above)."
match = ["explorer.autoOpenDroppedFile"]

[[rule]]
status = "blocked"
reason = "needs drag and drop in the Explorer"
comment = "explorer.confirmDragAndDrop asks before a drag moves files and folders. The tree has no drag and drop yet (see explorer.enableDragAndDrop above)."
match = ["explorer.confirmDragAndDrop"]

[[rule]]
status = "blocked"
reason = "needs copy and paste in the Explorer"
comment = "explorer.confirmPasteNative asks before pasting files from the OS clipboard. rscode's Explorer has no paste yet (see explorer.incrementalNaming above)."
match = ["explorer.confirmPasteNative"]

[[rule]]
status = "blocked"
reason = "needs undo for Explorer file operations"
comment = "explorer.confirmUndo asks before an undo of an Explorer operation. There is no undo stack yet (see explorer.enableUndo above)."
match = ["explorer.confirmUndo"]

[[rule]]
status = "blocked"
reason = "needs a scroll capture on the editor surface"
comment = "editor.scrollPredominantAxis drops the minor axis of a wheel gesture before the rows scroll, and editor.scrollOnMiddleClick starts a middle-button autoscroll. Both need the editor surface to capture the pointer and scroll itself (the rows scroll inside gpui's list today)."
match = ["editor.scrollPredominantAxis", "editor.scrollOnMiddleClick"]

[[rule]]
status = "blocked"
reason = "needs color decorators in the editor (document color provider)"
comment = "editor.defaultColorDecorators picks the default provider of the inline colour swatches. rscode draws no colour decorators yet (colorDetector)."
match = ["editor.defaultColorDecorators"]

[[rule]]
status = "blocked"
reason = "needs formatting providers from the extension host"
comment = "editor.defaultFormatter takes precedence over the other formatters. rscode has no formatters without the extension host (ADR-0020), like the other editor.format* settings."
match = ["editor.defaultFormatter"]

[[rule]]
status = "blocked"
reason = "needs folding range providers from the extension host"
comment = "editor.defaultFoldingRangeProvider picks the folding provider that wins over the others. rscode folds by indentation only (folding.rs); the providers come from the extension host."
match = ["editor.defaultFoldingRangeProvider"]

# ---------------------------------------------------------------------------------------------
# breadcrumbs (ADR-0047). breadcrumbs.enabled, filePath and icons are wired (config/wired.rs).
# The symbol part needs the document symbol providers of the extension host, and the outline
# filters (showFiles and the other show<Kind> settings) filter those same symbols.
# ---------------------------------------------------------------------------------------------

[[rule]]
status = "blocked"
reason = "needs custom editors (the editor type dropdown switches between editors for one file)"
comment = "breadcrumbs.showEditorType shows a dropdown when a custom editor can open the file. rscode has the text editor only."
match = ["breadcrumbs.showEditorType"]

[[rule]]
status = "blocked"
reason = "needs the Outline view (the symbols of the active file in a view of the Explorer)"
comment = "outline.* configures the Outline view, which lists the symbols of the active file. The symbols and their provider ask (ADR-0086) exist; the view itself does not yet (ADR-0087 follow-up). The outline.problems.* settings also need the diagnostics of the outline (markers per symbol)."
match = ["outline*"]

[[rule]]
status = "blocked"
reason = "needs the Search Editor"
comment = "search.searchEditor.* configures search results shown in an editor tab (the Search Editor). rscode only has the Search view (ADR-0023); search.mode is blocked for the same reason."
match = ["search.searchEditor*"]

[[rule]]
status = "blocked"
reason = "needs the Replace Preview (a preview of each replace before it is applied)"
comment = "search.useReplacePreview opens the Replace Preview when a match is selected or replaced. rscode's Search view replaces without a preview."
match = ["search.useReplacePreview"]

[[rule]]
status = "blocked"
reason = "needs workspace symbols (symbol provider, via the extension host)"
comment = "search.quickOpen.includeSymbols adds the results of a workspace symbol search to Quick Open. The symbols come from the extension host (ADR-0020), so Quick Open has no symbol results yet."
match = ["search.quickOpen.includeSymbols"]

[[rule]]
status = "n/a"
reason = "AI chat, agents and copilot (product)"
comment = "workbench.commandPalette.experimental.enableNaturalLanguageSearch ranks commands with AI, and askChatLocation and showAskInChat send questions to chat. rscode has no AI chat or AI search (ADR-0023 and the AI policy)."
match = ["workbench.commandPalette.experimental.enableNaturalLanguageSearch", "workbench.commandPalette.experimental.askChatLocation", "workbench.commandPalette.showAskInChat"]

[[rule]]
status = "blocked"
reason = "needs the suggested commands list (commands ranked by use for the palette)"
comment = "workbench.commandPalette.experimental.suggestCommands shows a list of commonly used commands at the top of the palette. rscode's palette keeps only the command history (workbench.commandPalette.history); there is no suggested list yet."
match = ["workbench.commandPalette.experimental.suggestCommands"]

[[rule]]
status = "blocked"
reason = "needs hover widgets with a configurable delay (gpui tooltips use a fixed delay)"
comment = "workbench.sash.hoverDelay sets how long the hover feedback on a sash takes. gpui tooltips use a fixed delay, so the setting has no effect yet (the same gap as the other hover delays)."
match = ["workbench.sash.hoverDelay"]

[[rule]]
status = "blocked"
reason = "needs the Copy Breadcrumbs Path command (the symbol path joined by this separator)"
comment = "breadcrumbs.symbolPathSeparator joins the symbol path when the path is copied (breadcrumbsControl.ts CopyPath). rscode has no copy-path command yet. symbolPath, symbolSortOrder and show<Kind> are wired (ADR-0087)."
match = ["breadcrumbs.symbolPathSeparator"]

[[rule]]
status = "blocked"
reason = "needs an Open Editors pane in the Explorer"
comment = "explorer.openEditors.visible, minVisible and sortOrder size and sort the Open Editors list at the top of the Explorer view. rscode's Explorer shows the file tree only; the open editors are tabs (model.rs). The list is a feature of its own, so these wait for it."
match = ["explorer.openEditors.visible", "explorer.openEditors.minVisible", "explorer.openEditors.sortOrder"]

[[rule]]
status = "blocked"
reason = "needs view containers that can be hidden (rscode always shows four)"
comment = "workbench.activityBar.autoHide hides a top or bottom activity bar when only one view container is shown. rscode always has four (Explorer, Search, Source Control, Extensions), so there is nothing to hide yet; it waits for the view containers of the extension host (ADR-0020)."
match = ["workbench.activityBar.autoHide"]

[[rule]]
status = "blocked"
reason = "needs the horizontal bar's height in the scroll height (rscode's list measures whole rows)"
comment = "editor.scrollbar.ignoreHorizontalScrollbarInContentHeight decides whether the horizontal bar's height adds to the scroll height (viewLayout.ts getScrollHeight). rscode's editor is a uniform list of rows, so the bar's height would need a spacer row. The other five editor.scrollbar.* settings are wired (ADR-0054)."
match = ["editor.scrollbar.ignoreHorizontalScrollbarInContentHeight"]
