[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
vsr-text = { path = "crates/vsr-text" }
vsr-editor = { path = "crates/vsr-editor" }
vsr-settings = { path = "crates/vsr-settings" }
vsr-search = { path = "crates/vsr-search" }
vsr-quickinput = { path = "crates/vsr-quickinput" }
vsr-find = { path = "crates/vsr-find" }
vsr-commands = { path = "crates/vsr-commands" }
vsr-theme = { path = "crates/vsr-theme" }
vsr-languages = { path = "crates/vsr-languages" }
vsr-textmate = { path = "crates/vsr-textmate" }
vsr-syntax = { path = "crates/vsr-syntax" }
vsr-rpc = { path = "crates/vsr-rpc" }
vsr-exthost = { path = "crates/vsr-exthost" }
vsr-suggest = { path = "crates/vsr-suggest" }
