# Upstream port manifest: which upstream VS Code files we port, where they live
# in Rust, and the upstream commit each entry was last synced at.
# Read and edited by scripts/upstream-sync (see UPSTREAM.md).
#
# Format: a small TOML subset (strings, string arrays, comments). Keep it simple;
# the tool's parser is stdlib-only and rejects anything fancier.
#
# [[port]] fields:
#   id        stable name used on the command line (kebab-case)
#   status    planned | partial | ported
#   upstream  upstream path globs, git ":(glob)" semantics: ** crosses dirs,
#             * does not, a bare directory matches everything below it
#   exclude   optional globs removed from `upstream`
#   rust      Rust files/dirs in this repo that port those paths
#   synced    full upstream commit SHA this entry was last brought up to date with
#             (update it with `scripts/upstream-sync mark <id>`, not by hand)
#   notes     free text for agents

[upstream]
repo = "https://github.com/microsoft/vscode"
branch = "main"
clone = "../vscode-original"   # relative to this repo's root
ref = "HEAD"                   # default comparison target in the clone
pinned = "50e1350fc78df67b11049b903d96b530f28d26a5"   # 1.147.0, 2026-11-09: baseline the port started from
version = "1.147.0"

[[port]]
id = "editor-text-model"
status = "partial"
upstream = [
  "src/vs/editor/common/model/pieceTreeTextBuffer/**",
  "src/vs/editor/test/common/model/pieceTreeTextBuffer/**",
  "src/vs/editor/test/common/model/linesTextBuffer/**",
]
rust = ["crates/vsr-text/src/lib.rs", "crates/vsr-text/tests/buffer.rs", "crates/vsr-text/tests/upstream_piece_tree.rs"]
synced = "50e1350fc78df67b11049b903d96b530f28d26a5"
notes = "Piece tree text buffer. vsr-text uses a line vector behind the same API (ADR-0005). 52 upstream tests ported and passing; 23 #[ignore]d until TextBuffer gets raw-offset insert/delete (offsets between \\r and \\n)."

[[port]]
id = "editor-core-position-range"
status = "partial"
upstream = [
  "src/vs/editor/common/core/position.ts",
  "src/vs/editor/common/core/range.ts",
]
rust = ["crates/vsr-text/src/position.rs", "crates/vsr-text/src/range.rs"]
synced = "50e1350fc78df67b11049b903d96b530f28d26a5"
notes = "1-based line/column Position and Range value types."

[[port]]
id = "theme-dark-modern"
status = "partial"
upstream = [
  "extensions/theme-defaults/themes/dark_modern.json",
  "extensions/theme-defaults/themes/dark_plus.json",
  "extensions/theme-defaults/themes/dark_vs.json",
]
rust = ["crates/vsr-app/src/theme.rs"]   # moves to vsr-platform theme service later
synced = "50e1350fc78df67b11049b903d96b530f28d26a5"
notes = "Workbench colors hard-coded from dark_modern.json in vsr-app. dark_modern includes dark_plus which includes dark_vs, so all three define the result."

[[port]]
id = "workbench-layout"
status = "planned"
upstream = ["src/vs/workbench/browser/layout.ts"]
rust = ["crates/vsr-app/src/main.rs"]
synced = "50e1350fc78df67b11049b903d96b530f28d26a5"
notes = "Workbench part layout (title/activity/side/editor/panel/status). vsr-app hand-builds the classic layout; moves to vsr-workbench."

[[port]]
id = "editor-cursor"
status = "partial"
upstream = [
  "src/vs/editor/common/cursor/cursor.ts",
  "src/vs/editor/common/cursor/cursorMoveOperations.ts",
  "src/vs/editor/common/cursor/cursorWordOperations.ts",
  "src/vs/editor/common/cursor/cursorTypeOperations.ts",
  "src/vs/editor/common/cursor/cursorDeleteOperations.ts",
  "src/vs/editor/common/core/selection.ts",
  "src/vs/editor/common/core/cursorColumns.ts",
  "src/vs/editor/common/core/misc/indentation.ts",
  "src/vs/editor/common/model/editStack.ts",
  "src/vs/base/common/strings.ts",
  "src/vs/editor/test/browser/controller/cursor.test.ts",
  "src/vs/editor/test/browser/controller/cursorMoveCommand.test.ts",
]
rust = ["crates/vsr-editor/src", "crates/vsr-editor/tests"]
synced = "50e1350fc78df67b11049b903d96b530f28d26a5"
notes = "Cursor, selection, typing and undo core (vsr-editor). Single cursor; no indent/onEnter rules, no multi-line Tab indent, no word-separator config, no sticky tab stops. 30 cursor-move cases and 10 edit cases (one simplified) ported from cursor.test.ts and cursorMoveCommand.test.ts, plus our own edit, undo and word tests."

[[port]]
id = "settings-editor"
status = "partial"
upstream = [
  "src/vs/workbench/contrib/preferences/browser/settingsLayout.ts",
  "src/vs/workbench/contrib/preferences/browser/settingsTree.ts",
  "src/vs/workbench/contrib/preferences/browser/settingsEditor2.ts",
  "src/vs/workbench/contrib/preferences/browser/settingsTreeModels.ts",
  "src/vs/workbench/contrib/preferences/common/preferences.ts",
  "src/vs/workbench/contrib/preferences/test/browser/settingsTreeModels.test.ts",
]
rust = [
  "crates/vsr-settings/src/title.rs",
  "crates/vsr-settings/src/schema.rs",
  "crates/vsr-settings/src/toc.rs",
  "crates/vsr-settings/src/registry.rs",
  "crates/vsr-settings/tests/title.rs",
]
synced = "50e1350fc78df67b11049b903d96b530f28d26a5"
notes = "Settings data + TOC + title formatting. Settings are the export of VS Code 1.144.1 (installed app, not the 1.147.0 pin): crates/vsr-settings/assets is regenerated by scripts/export-default-settings. Sandbox-specific title overrides in settingKeyToDisplayFormat are not ported. Search is a simple ranking, not upstream's SearchResultModel."

[[port]]
id = "settings-editor-ui"
status = "partial"
upstream = [
  "src/vs/workbench/contrib/preferences/browser/settingsEditor2.ts",
  "src/vs/workbench/contrib/preferences/browser/settingsTree.ts",
  "src/vs/workbench/contrib/preferences/browser/settingsWidgets.ts",
  "src/vs/workbench/contrib/preferences/browser/tocTree.ts",
  "src/vs/workbench/contrib/preferences/browser/settingsTreeModels.ts",
  "src/vs/workbench/contrib/preferences/browser/media/settingsEditor2.css",
  "src/vs/workbench/contrib/preferences/browser/media/settingsWidgets.css",
]
rust = [
  "crates/vsr-app/src/settings_view.rs",
  "crates/vsr-app/src/settings/markdown.rs",
  "crates/vsr-app/src/settings/model.rs",
  "crates/vsr-app/src/settings/validate.rs",
]
synced = "50e1350fc78df67b11049b903d96b530f28d26a5"
notes = "Settings editor UI on gpui (ADR-0017): header search + count, User/Workspace tabs, TOC with sash, virtualised grouped list, row layout/colors from settingsEditor2.css. Not ported: settings search suggestions, TOC counts in search mode, sticky scroll, list/object widgets (we link to settings.json), workspace/folder scopes, language overrides, sync/profile indicators, keyboard navigation of rows. Markdown is inline-only."

[[port]]
id = "editor-view"
status = "partial"
upstream = [
  "src/vs/editor/browser/viewParts/viewCursors/viewCursors.ts",
  "src/vs/editor/browser/viewParts/viewCursors/viewCursor.ts",
  "src/vs/editor/browser/viewParts/lineNumbers/lineNumbers.ts",
  "src/vs/editor/browser/viewParts/currentLineHighlight/currentLineHighlight.ts",
  "src/vs/editor/browser/viewParts/selections/selections.ts",
  "src/vs/editor/browser/coreCommands.ts",
]
rust = ["crates/vsr-app/src/editor_view.rs", "crates/vsr-app/src/keymap.rs"]
synced = "50e1350fc78df67b11049b903d96b530f28d26a5"
notes = "Editable gpui editor surface (ADR-0018): blinking line cursor, selection and current-line highlight, active line number, key table for macOS defaults, platform text input (typing, IME marking). Not ported: smooth/phase/expand cursor styles, multi-cursor, overview ruler, selection rounded corners, glyph margin, word wrap. text_layout.rs (pixel/column mapping, adapts common/core/cursorColumns.ts) and editor_view/e2e.rs are ours and carry no header."
