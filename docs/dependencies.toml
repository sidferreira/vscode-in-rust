# Feature dependency graph for rscode. Read by scripts/dependency-tree, which writes
# docs/dependency-tree.md (do not edit that file by hand). Hand-maintained: edit this file when
# a feature lands, a new blocker shows up, or an edge turns out wrong.
#
# Sources the counts come from (never copied here):
#   upstream/settings.toml        blocked reasons ([[rule]] reason) and exthost sources
#   crates/vsr-app/src/config/wired.rs + crates/vsr-settings/assets/default-configuration.json
#                                 wired / todo / n/a status, via scripts/settings-port
#   tests/e2e-scenarios/*.md      smoke scenario status and blocker labels
#   docs/research/extensions-compat.md section 4   extension phases P0-P7 and their effort
#
# Node fields (all optional except id, title, status):
#   id          kebab-case, unique, used in `needs`
#   title       short label
#   status      done | in-progress | todo | blocked-external
#   kind        feature (default) | extension (an upstream extension that rscode should run)
#   effort      S | M | L | XL (or a source string such as "M-L"), "-" when done
#   effort_source  "guess" or "extensions-compat §4 (P2)" (checked by the tests against §4)
#   needs       node ids that must be done first (a directed edge: need -> node)
#   reasons     EXACT blocked-reason strings from settings.toml. Each reason belongs to one node.
#   sources     exthost sources (built-in extension ids from settings.toml). One node each.
#   todo_globs  setting-key globs for todo settings this node would unblock (inferred by prefix
#               unless the note says otherwise). Counted as "todo settings", not as blocked.
#   scenarios   exact blocker labels from the e2e status column (split on ';', the prefix
#               "blocked-on-feature " removed). A label may name several nodes.
#   external    for blocked-external: what the blocker is and who must act
#   deferred    true = a user priority decision (ROADMAP) keeps it out of the ranking
#   note        free text; "inferred" marks an edge or mapping that no source states
#
# Counting rules are in docs/dependency-tree.md (header). Node statuses reflect the repo at
# 2026-11-10 (after the editor UI and extension host P1 merges).
#
# MERGE NOTE: when those sibling branches land they delete their `blocked` [[rule]]s from
# settings.toml. scripts/dependency-tree then errors ("reason is not a blocked reason") until the
# matching node is changed: set status = "done", drop its `reasons` (and, for the extension host,
# keep its needs). Budget for that in the merge recipe.

