[package]
name = "vsr-app"
description = "The rscode desktop binary (native workbench window)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rscode"
path = "src/main.rs"

[dependencies]
vsr-text.workspace = true
vsr-settings.workspace = true
serde_json = "1"
# UI: gpui via gpui-kit (ADR-0012). 0.9.1 is quarantined by the proxy; pinned exactly.
gpui-kit = "=0.9.0"
vsr-editor.workspace = true

[dev-dependencies]
# Headless gpui tests (TestAppContext / VisualTestContext), docs/testing.md tier 2 (ADR-0017/0018).
# gpui-kit's own `test-support` feature cannot be used: it makes the lockfile resolver pull the
# gpui-fast stack, whose pins conflict with gpui-pre's (taffy, unicode-properties).
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
