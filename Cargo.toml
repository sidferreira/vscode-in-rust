[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
vsr-text = { path = "crates/vsr-text" }
vsr-editor = { path = "crates/vsr-editor" }
vsr-settings = { path = "crates/vsr-settings" }
vsr-search = { path = "crates/vsr-search" }
vsr-find = { path = "crates/vsr-find" }
