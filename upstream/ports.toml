  "crates/vsr-settings/tests/configuration.rs",
]
synced = "50e1350fc78df67b11049b903d96b530f28d26a5"
notes = "Default + user layers only (no workspace, folder, language-override or policy layers). Validation against the registered schema happens in the model (upstream leaves it to consumers); out-of-range numbers are clamped like editorOptions. Change keys are the diff of the raw user documents, affects() is affectsConfiguration without overrides."

